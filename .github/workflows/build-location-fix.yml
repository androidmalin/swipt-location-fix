name: Build Swipt location fix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          submodules: true
          persist-credentials: false
      - name: Select stable Xcode
        run: .github/select_xcode.sh
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile
      - name: Build embedded runtime
        working-directory: internal/automation/runtime
        run: bun build.mjs
      - name: Check location lifecycle and races
        run: go test -race -count=1 -timeout=3m ./internal/device ./internal/automation
      - name: Build iPhone native library
        run: go run ./internal/cmd/build_libswipt -target ios/arm64
      - name: Prepare React Native frameworks
        run: bun dev frameworks
      - name: Build IPA
        run: make archive_ios_ipa
        env:
          XCODEBUILD_FLAGS: MARKETING_VERSION=0.1.0 CURRENT_PROJECT_VERSION=83.1
      - name: Record package checksum
        run: shasum -a 256 build/Swipt.ipa > build/Swipt.ipa.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Swipt-location-fix
          path: |
            build/Swipt.ipa
            build/Swipt.ipa.sha256
          if-no-files-found: error
          retention-days: 7
